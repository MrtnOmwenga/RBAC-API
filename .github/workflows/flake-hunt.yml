name: Flake hunt

# Runs the whole suite ten times with no retries. A test that fails only sometimes shows up here
# with its full output, instead of as a mystery red build later.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Ten full runs
        run: |
          failed=0
          for i in $(seq 1 10); do
            if ! npx jest --ci > "run-$i.log" 2>&1; then
              failed=$((failed + 1))
              echo "::error::Run $i failed"
              grep -E "✕|●" "run-$i.log" | head -20
            fi
          done
          echo "$failed of 10 runs failed"
          test "$failed" = 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with: { name: flake-hunt-logs, path: run-*.log }
