version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      nestjs: { patterns: ['@nestjs/*'] }
      dev-dependencies: { dependency-type: development }
    ignore:
      # ES-module-only releases: wait until the project moves off CommonJS
      - dependency-name: '@nestjs/common'
        versions: ['>=12']
      - dependency-name: '@nestjs/core'
        versions: ['>=12']
      - dependency-name: '@nestjs/platform-express'
        versions: ['>=12']
      - dependency-name: kysely
        versions: ['>=0.29']
      # A TypeScript major version is a migration, not a bump: 6 and 7 break the lint, types and
      # tests here (typescript-eslint and ts-jest lag behind). It gets its own planned PR.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ['*'] }
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
